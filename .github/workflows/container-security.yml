name: Container security

on:
  push:
  pull_request:
  schedule:
    - cron: "47 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-scan:
    name: ${{ matrix.image }} (${{ matrix.platform }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: backend
            context: ./backend
            platform: linux/amd64
            architecture: amd64
            tag: atlas-backend-amd64:ci
          - image: backend
            context: ./backend
            platform: linux/arm64
            architecture: arm64
            tag: atlas-backend-arm64:ci
          - image: frontend
            context: ./frontend
            platform: linux/amd64
            architecture: amd64
            tag: atlas-frontend-amd64:ci
          - image: frontend
            context: ./frontend
            platform: linux/arm64
            architecture: arm64
            tag: atlas-frontend-arm64:ci
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          platforms: ${{ matrix.platform }}
          load: true
          push: false
          tags: ${{ matrix.tag }}
      - name: Scan image for high and critical CVEs
        id: trivy
        continue-on-error: true
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: ${{ matrix.tag }}
          format: sarif
          output: trivy-${{ matrix.image }}-${{ matrix.architecture }}.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Upload CVE report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: trivy-${{ matrix.image }}-${{ matrix.architecture }}
          path: trivy-*.sarif
          if-no-files-found: warn
          retention-days: 14
      - name: Fail on high or critical CVEs
        if: steps.trivy.outcome == 'failure'
        run: exit 1
